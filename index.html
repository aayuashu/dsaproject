<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Rankings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <!-- Home Page Content -->
     <header>
        <h1>Top Momo Places</h1>
    </header>
    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

   

    <main>
        <ul id="restaurant-list">
            <!-- JavaScript will populate restaurant rankings here -->
        </ul>

        <!-- User Input Form -->
        <h2>Add a Restaurant</h2>
        <form id="add-restaurant-form">
            <input type="text" id="restaurant-name" placeholder="Restaurant Name" required>
            <input type="number" id="restaurant-rating" min="1" max="5" step="0.1" placeholder="Rating (1-5)" required>
            <button type="submit">Add Restaurant</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
